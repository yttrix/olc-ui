name: release

# Tag v* -> build Linux binaries with the embedded panel and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build panel frontend
        run: cd web && npm ci && npm run build
      - name: Test
        shell: bash
        run: set +e; go test -short ./internal/... ./core/... 2>&1 | tee test.log; code=${PIPESTATUS[0]}; grep -E -A6 '^(--- FAIL|FAIL|panic:)' test.log | head -60 | sed 's/^/::error::/'; exit $code
      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/olc-ui-linux-$arch ./cmd/olc-ui
          done
          cp scripts/olc-ui.sh dist/olc-ui.sh
          cd dist && sha256sum olc-ui-* olc-ui.sh > SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
